<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic Lab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Arabic Lab</h1>
    <div class="topbar-right">
      <div id="stageLabel" class="stage-label"></div>
      <button id="lessonToggleBtn" class="btn small">Lesson</button>
    </div>
  </header>

  <main id="app" class="app">
    <section id="lessonCard" class="card lesson-card">
      <div id="lessonBody" class="lesson-body"></div>
      <div class="action-row">
        <button id="startDrillingBtn" class="btn primary">Start drilling</button>
      </div>
    </section>

    <section id="drillCard" class="card hidden">
      <div class="meta-row">
        <span id="variantLabel" class="badge"></span>
        <span id="masteryLabel" class="mastery"></span>
      </div>

      <div id="promptBlock" class="prompt-block">
        <p class="loading">Loading drill…</p>
      </div>

      <div id="optionsGrid" class="options-grid"></div>

      <div class="action-row">
        <button id="nextBtn" class="btn primary" disabled>Next</button>
      </div>

      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
